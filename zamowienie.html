<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Kasa - CeraSfera.</title>
    <meta name="description" content="Finalizacja zamówienia w sklepie internetowym CeraSfera.">
    
    <!-- Czcionki Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Nawigacja -->
    <div id="site-header"></div>
    <!-- Główna zawartość kasy -->
    <main class="container my-5">
        <!-- Nawigacja okruszkowa -->
        <nav aria-label="breadcrumb" class="mb-4">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="index.html" class="text-decoration-none text-muted">Strona Główna</a></li>
                <li class="breadcrumb-item"><a href="koszyk.html" class="text-decoration-none text-muted">Koszyk</a></li>
                <li class="breadcrumb-item active text-dark" aria-current="page">Zamówienie</li>
            </ol>
        </nav>

        <h1 class="display-5 fw-bold mb-4">Finalizacja Zamówienia</h1>

        <form action="konto.html" method="GET">
            <div class="row g-5">
                
                <!-- Kolumna Formularza Danych -->
                <div class="col-lg-8">
                    
                    <!-- Dane bilingowe i adres dostawy -->
                    <div class="p-4 bg-light shadow-sm mb-4">
                        <h4 class="h5 mb-3">1. Dane adresowe</h4>
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label for="firstName" class="form-label small text-muted">Imię</label>
                                <input type="text" class="form-control" id="firstName" required>
                            </div>
                            <div class="col-md-6">
                                <label for="lastName" class="form-label small text-muted">Nazwisko</label>
                                <input type="text" class="form-control" id="lastName" required>
                            </div>
                            <div class="col-12">
                                <label for="address" class="form-label small text-muted">Ulica i numer</label>
                                <input type="text" class="form-control" id="address" placeholder="np. Marszałkowska 10/5" required>
                            </div>
                            <div class="col-md-4">
                                <label for="zip" class="form-label small text-muted">Kod pocztowy</label>
                                <input type="text" class="form-control" id="zip" placeholder="00-000" required>
                            </div>
                            <div class="col-md-8">
                                <label for="city" class="form-label small text-muted">Miasto</label>
                                <input type="text" class="form-control" id="city" required>
                            </div>
                            <div class="col-md-6">
                                <label for="phone" class="form-label small text-muted">Telefon</label>
                                <input type="tel" class="form-control" id="phone" required>
                            </div>
                            <div class="col-md-6">
                                <label for="email" class="form-label small text-muted">E-mail</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                        </div>

                        <!-- Opcjonalny checkbox faktury na firmę -->
                        <div class="form-check mt-4">
                            <input class="form-check-input" type="checkbox" id="companyCheck" data-bs-toggle="collapse" data-bs-target="#companyFields">
                            <label class="form-check-label small" for="companyCheck">
                                Chcę otrzymać fakturę na firmę
                            </label>
                        </div>

                        <!-- Ukryte pola firmy -->
                        <div class="collapse mt-3" id="companyFields">
                            <div class="row g-3 p-3 bg-white border">
                                <div class="col-md-6">
                                    <label for="nip" class="form-label small text-muted">NIP</label>
                                    <input type="text" class="form-control" id="nip" placeholder="1234567890">
                                </div>
                                <div class="col-md-6">
                                    <label for="companyName" class="form-label small text-muted">Nazwa firmy</label>
                                    <input type="text" class="form-control" id="companyName">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Metoda dostawy -->
                    <div class="p-4 bg-light shadow-sm mb-4">
                        <h4 class="h5 mb-3">2. Metoda dostawy</h4>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="shippingMethod" id="ship1" checked>
                            <label class="form-check-label" for="ship1">
                                Kurier DPD (15 zł) - dostawa w 24-48h
                            </label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="shippingMethod" id="ship2">
                            <label class="form-check-label" for="ship2">
                                Paczkomat InPost (12 zł)
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="shippingMethod" id="ship3">
                            <label class="form-check-label" for="ship3">
                                Odbiór osobisty w Warszawie (0 zł)
                            </label>
                        </div>
                    </div>

                    <!-- Metoda płatności -->
                    <div class="p-4 bg-light shadow-sm">
                        <h4 class="h5 mb-3">3. Metoda płatności</h4>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="pay1" checked>
                            <label class="form-check-label" for="pay1">
                                BLIK
                            </label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="pay2">
                            <label class="form-check-label" for="pay2">
                                Karta płatnicza (Visa / Mastercard)
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="paymentMethod" id="pay3">
                            <label class="form-check-label" for="pay3">
                                Szybki przelew elektroniczny
                            </label>
                        </div>
                    </div>

                </div>

                <!-- Kolumna Skróconego Podsumowania Zamówienia -->
                <div class="col-lg-4">
                    <div class="p-4 bg-light shadow-sm sticky-top" style="top: 20px;">
                        <h4 class="h5 mb-4 border-bottom pb-2">Twoje zamówienie</h4>
                        
                        <div class="d-flex justify-content-between small mb-2">
                            <span>Rustykalny Kubek Ziemi (1 szt.)</span>
                            <span>67 zł</span>
                        </div>
                        <div class="d-flex justify-content-between small mb-3 pb-3 border-bottom">
                            <span>Luksusowy Box Prezentowy (1 szt.)</span>
                            <span>199 zł</span>
                        </div>

                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Suma częściowa:</span>
                            <span>266 zł</span>
                        </div>
                        <div class="d-flex justify-content-between mb-2">
                            <span class="text-muted">Dostawa (Kurier):</span>
                            <span>15 zł</span>
                        </div>
                        <div class="d-flex justify-content-between mb-4 border-top pt-3">
                            <strong>Do zapłaty:</strong>
                            <strong class="fs-5 text-dark">281 zł</strong>
                        </div>

                        <!-- Checkboxy akceptacji regulaminu -->
                        <div class="form-check mb-3">
                            <input class="form-check-input" type="checkbox" value="" id="termsCheck" required>
                            <label class="form-check-label small" for="termsCheck">
                                Przeczytałem(-am) i akceptuję regulamin sklepu oraz politykę prywatności *
                            </label>
                        </div>

                        <button type="submit" class="btn btn-dark w-100 py-2">Kupuję i płacę</button>
                    </div>
                </div>

            </div>
        </form>
    </main>

    <!-- Stopka -->
    <div id="site-footer"></div>

    <!-- Skrypty -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="main.js"></script>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
