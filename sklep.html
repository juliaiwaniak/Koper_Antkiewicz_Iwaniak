            <aside class="col-lg-3">
                <div class="p-4 bg-light shadow-sm">
                    <h4 class="h5 mb-3">Filtry</h4>
                    
                    <!-- Kategorie -->
                    <div class="mb-4">
                        <h6 class="text-muted small fw-bold mb-2">Kategorie</h6>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="kat1" checked>
                            <label class="form-check-label small" for="kat1">Wszystkie</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="kat2">

                    <div class="mb-4">
                        <h6 class="text-muted small fw-bold mb-2">Cena (zł)</h6>
                        <input type="range" class="form-range" min="0" max="500" step="10" id="priceRange">

                            <span>500 zł</span>

                        <div class="form-check">

                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" value="" id="kolor2">
                            <label class="form-check-label small" for="kolor2">Szkliwo matowe</label>
